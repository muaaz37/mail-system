<div class="support-sidebar">
  <div>
    <div class="support-brand">
      <div class="support-brand-mark">
        <i class="pi pi-comments"></i>
      </div>
      <div>
        <p class="support-brand-eyebrow">THM Support</p>
        <h1>Mail Desk</h1>
      </div>
    </div>

    <button type="button" class="compose-button" (click)="createMail()">
      <span class="compose-icon"><i class="pi pi-plus"></i></span>
      <span>
        <span class="compose-label">New message</span>
        <span class="compose-hint">Internal or external mail</span>
      </span>
    </button>

    <div class="support-nav">
      @for (item of navigationItems; track item.route) {
        <a
          class="support-nav-item"
          [routerLink]="item.route"
          routerLinkActive="support-nav-item-active"
          [routerLinkActiveOptions]="{exact: item.exact}"
        >
          <span class="support-nav-icon"><i [class]="item.icon"></i></span>
          <span class="support-nav-copy">
            <span class="support-nav-label">{{ item.label }}</span>
            <span class="support-nav-description">{{ item.description }}</span>
          </span>
        </a>
      }
    </div>
  </div>

  <div class="support-sidebar-footer">
    <div class="mailbox-health">
      <span class="health-dot"></span>
      <span>
        <strong>Mailbox online</strong>
        <small>IMAP/SMTP configured</small>
      </span>
    </div>
    <button type="button" class="logout-button" (click)="logout()">
      <i class="pi pi-sign-out"></i>
      <span>Logout</span>
    </button>
  </div>
</div>
