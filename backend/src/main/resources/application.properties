spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=dbuser
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop

app.secret=default_secret_key
app.name=MyApp
app.jwt.expires-seconds=3600
app.jwt.secret=jwt_secret_key

file.upload-dir=uploads

spring.mail.host=${MAIL_SMTP_HOST:localhost}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_SMTP_USERNAME:test}
spring.mail.password=${MAIL_SMTP_PASSWORD:test}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.transport.protocol=${MAIL_SMTP_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:true}


mail.imap.host=${MAIL_IMAP_HOST:localhost}
mail.imap.port=${MAIL_IMAP_PORT:993}
mail.imap.username=${MAIL_IMAP_USERNAME:test}
mail.imap.password=${MAIL_IMAP_PASSWORD:test}

mail.imap.protocol=${MAIL_IMAP_PROTOCOL:imaps}
mail.imap.folder=${MAIL_IMAP_FOLDER:INBOX}

mail.polling.interval-ms=${MAIL_POLLING_INTERVAL_MS:60000}

support.mail.address=${SUPPORT_MAIL_ADDRESS:test@example.com}