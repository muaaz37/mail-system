spring.application.name=backend
server.port=${SERVER_PORT:8080}

springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dbuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}

app.secret=${APP_SECRET:default_secret_key}
app.name=${APP_NAME:mail-system}
app.jwt.expires-seconds=${APP_JWT_EXPIRES_SECONDS:3600}
app.jwt.secret=${APP_JWT_SECRET:jwt_secret_key}

storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:8333}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
storage.s3.bucket=${STORAGE_S3_BUCKET:mail-attachments}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE_ACCESS:true}
storage.s3.initialize-bucket=${STORAGE_S3_INITIALIZE_BUCKET:false}

spring.mail.host=${MAIL_SMTP_HOST:localhost}
spring.mail.port=${MAIL_SMTP_PORT:1025}
spring.mail.username=${MAIL_SMTP_USERNAME:}
spring.mail.password=${MAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.protocol=${MAIL_SMTP_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:true}


mail.imap.host=${MAIL_IMAP_HOST:localhost}
mail.imap.port=${MAIL_IMAP_PORT:993}
mail.imap.username=${MAIL_IMAP_USERNAME:}
mail.imap.password=${MAIL_IMAP_PASSWORD:}
mail.imap.protocol=${MAIL_IMAP_PROTOCOL:imaps}
mail.imap.folder=${MAIL_IMAP_FOLDER:INBOX}

mail.polling.interval-ms=${MAIL_POLLING_INTERVAL_MS:60000}
support.mail.address=${SUPPORT_MAIL_ADDRESS:support@example.invalid}
