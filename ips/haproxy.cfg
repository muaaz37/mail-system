# Global HAProxy settings
global
    log stdout format raw local0
    maxconn 2048

# Shared defaults for all frontends and backends
defaults
    # use the log settings from the global section
    log global

    # set the default mode to TCP, since we are passing through TLS traffic
    mode tcp

    # set the default logging format to TCP log format
    option tcplog

    # set the default timeouts for client and server connections
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout queue 5s
    timeout client-fin 5s
    timeout server-fin 5s

# Public HTTP entry point
frontend public_http
    # Listen on port 8080 for incoming HTTP connections
    bind :8080

    # Monitor and limit connections per source IP
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src

    acl too_many_connections sc0_conn_cur gt 20
    acl connection_rate_exceeded sc0_conn_rate gt 50

    tcp-request connection reject if too_many_connections
    tcp-request connection reject if connection_rate_exceeded

    # Route all HTTP traffic to the WAF_HTTP backend
    default_backend waf_http

# Public HTTPS entry point
frontend public_https
    # Listen on port 8443 for incoming HTTPS connections
    bind :8443

    # Monitor and limit connections per source IP
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src

    acl too_many_connections sc0_conn_cur gt 20
    acl connection_rate_exceeded sc0_conn_rate gt 50

    tcp-request connection reject if too_many_connections
    tcp-request connection reject if connection_rate_exceeded

    # Route all HTTPS traffic to the WAF_HTTPS backend
    default_backend waf_https

# Forward traffic to the ModSecurity WAF
backend waf_http
    server waf proxy:8080 check inter 5s fall 3 rise 2

backend waf_https
    server waf proxy:8443 check inter 5s fall 3 rise 2
