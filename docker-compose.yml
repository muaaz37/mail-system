services:
  mail-client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - mail-server

  mail-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      FILE_UPLOAD_DIR: /app/uploads

      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_PROTOCOL: ${MAIL_SMTP_PROTOCOL}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE}

      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT}
      MAIL_IMAP_USERNAME: ${MAIL_IMAP_USERNAME}
      MAIL_IMAP_PASSWORD: ${MAIL_IMAP_PASSWORD}
      MAIL_IMAP_PROTOCOL: ${MAIL_IMAP_PROTOCOL}
      MAIL_IMAP_FOLDER: ${MAIL_IMAP_FOLDER}

      MAIL_POLLING_INTERVAL_MS: ${MAIL_POLLING_INTERVAL_MS}
      SUPPORT_MAIL_ADDRESS: ${SUPPORT_MAIL_ADDRESS}

    volumes:
      - backend_uploads:/app/uploads

  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  backend_uploads:
