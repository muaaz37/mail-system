services:
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: mail-system-waf
    restart: unless-stopped
    environment:
      SERVER_NAME: localhost
      PORT: "8080"
      SSL_PORT: "8443"
      NGINX_ALWAYS_TLS_REDIRECT: "on"
      SSL_CERT_FILE: /run/secrets/proxy_certificate
      SSL_CERT_KEY_FILE: /run/secrets/proxy_private_key
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_FORMAT: JSON
      BLOCKING_PARANOIA: "2"
      DETECTION_PARANOIA: "3"
      ALLOWED_METHODS: "GET HEAD POST PUT PATCH DELETE OPTIONS"
      MODSEC_REQ_BODY_ACCESS: "On"
      MODSEC_REQ_BODY_LIMIT: "26214400"           # 25MiB
      MODSEC_REQ_BODY_NOFILES_LIMIT: "1048576"    # 1MiB
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      mail-client:
        condition: service_healthy
      mail-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    secrets:
      - proxy_certificate
      - proxy_private_key
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy-client
      - proxy-server
      - proxy-keycloak

  mail-client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
    depends_on:
      mail-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://localhost:8080/app/ || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /data:rw,noexec,nosuid,size=16m,mode=1777
      - /config:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - proxy-client

  mail-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      keycloak:
        condition: service_healthy
    expose:
      - "${SERVER_PORT:-8080}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-10MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-25MB}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME:-mail_system}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://seaweedfs:8333}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-mail-attachments}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY must be set}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY must be set}
      STORAGE_S3_PATH_STYLE_ACCESS: ${STORAGE_S3_PATH_STYLE_ACCESS:-true}
      STORAGE_S3_INITIALIZE_BUCKET: ${STORAGE_S3_INITIALIZE_BUCKET:-true}
      APP_NAME: ${APP_NAME:-mail-system}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI must be set}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:?KEYCLOAK_JWK_SET_URI must be set}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:?MAIL_SMTP_HOST must be set}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-465}
      MAIL_SMTP_USERNAME: "${MAIL_SMTP_USERNAME:-}"
      MAIL_SMTP_PASSWORD: "${MAIL_SMTP_PASSWORD:-}"
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_PROTOCOL: ${MAIL_SMTP_PROTOCOL:-smtp}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-false}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-true}

      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:?MAIL_IMAP_HOST must be set}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_IMAP_USERNAME: "${MAIL_IMAP_USERNAME:-}"
      MAIL_IMAP_PASSWORD: "${MAIL_IMAP_PASSWORD:-}"
      MAIL_IMAP_PROTOCOL: ${MAIL_IMAP_PROTOCOL:-imaps}
      MAIL_IMAP_FOLDER: ${MAIL_IMAP_FOLDER:-INBOX}

      MAIL_POLLING_INTERVAL_MS: ${MAIL_POLLING_INTERVAL_MS:-60000}
      SUPPORT_MAIL_ADDRESS: ${SUPPORT_MAIL_ADDRESS:?SUPPORT_MAIL_ADDRESS must be set}
    healthcheck: # check if server is up and running
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://localhost:$${SERVER_PORT:-8080}/api/swagger-ui/index.html",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    networks:
      - proxy-server
      - server-database
      - server-storage
      - server-keycloak

  database:
    image: postgres:16
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-mail_system}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mail_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - server-database

  seaweedfs:
    image: chrislusf/seaweedfs:4.38
    user: seaweed
    restart: unless-stopped
    command: "server -s3 -dir=/data"
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY must be set}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY must be set}
      S3_BUCKET: ${STORAGE_S3_BUCKET:-mail-attachments}
    expose:
      - "8333"
    volumes:
      - seaweedfs_data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    networks:
      - server-storage

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    image: mail-system-keycloak
    restart: unless-stopped
    command:
      - start
      - --optimized
      - --import-realm
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --hostname=https://localhost
      - --hostname-strict=true
    depends_on:
      keycloak-database:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_HEALTH_ENABLED: "true"   # enable health check endpoint
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-database:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - ./keycloak/realm-mail-support.json:/opt/keycloak/data/import/realm-mail-support.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
      - /opt/keycloak/data/tmp:rw,noexec,nosuid,size=64m,mode=1777
    networks:
      - proxy-keycloak
      - server-keycloak
      - keycloak-database

  keycloak-database:
    image: postgres:16
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=1777
    networks:
      - keycloak-database

volumes:
  db_data:
  seaweedfs_data:
  keycloak_db_data:

networks:
  proxy-client:
  proxy-server:
    internal: true
  proxy-keycloak:
    internal: true

  server-database:
    internal: true
  keycloak-database:
    internal: true

  server-storage:
    internal: true
  server-keycloak:
    internal: true

secrets:
  proxy_certificate:
    file: ./proxy/cert/proxy.crt
  proxy_private_key:
    file: ./proxy/cert/proxy.key
